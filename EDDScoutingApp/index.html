<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ThunderScout</title>

    <link rel="stylesheet" href="/src/assets/css/styles.css">
    <link rel="stylesheet" href="/src/assets/css/editor-styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    
    <script type="module" src="/src/app.ts"></script>
</head>

<body>

<div class="content" id="content">

    <!--Toolbar-->
    <div class="toolbar">

         <!--Content on left (toggle, save, etc)-->
        <div class="toolbar-left">

            <!--Toggle between edit and runtime mode-->
            <div class="toolbar-item" style="user-select:none">
                <label class="switch">
                    <input type="checkbox" id="edit-mode-toggle" checked="true">
                    <span class="slider"></span>
                </label>
                <span class="edit-mode-switch-label">Edit Mode</span>
            </div>
            
            <div class="toolbar-divider"></div>

            <!--Item in the toolbar-->
            <div class="toolbar-item">
                <button class="toolbar-button" id ="editor-button-save">
                    <i class="fa fa-floppy-o"></i>
                    <span>Save</span>
                </button>
            </div>

            <div class="toolbar-divider"></div>

            <div class="toolbar-item">
                <button class="toolbar-button" id ="editor-button-export">
                    <i class="fa fa-download"></i>
                    <span>Export App</span>
                </button>
            </div>

            <div class="toolbar-item">
                <button class="toolbar-button" id ="editor-button-upload">
                    <i class="fa fa-upload"></i>
                    <span>Import App</span>
                </button>
                <input id="load" type="file" accept="application/json" class="hidden"></button>
            </div>

        </div>

        <!--Content on right (copy, paste, etc)-->
        <div class="toolbar-right">

            <!--Item in the toolbar-->
            <div class="toolbar-item">
                <button class="toolbar-button" id="editor-button-undo">
                    <i class="fa fa-undo"></i>
                    <span>Undo</span>
                </button>
            </div>

            <div class="toolbar-item">
                <button class="toolbar-button">
                    <i class="fa fa-repeat" id="editor-button-redo"></i>
                    <span>Redo</span>
                </button>
            </div>

            <div class="toolbar-divider"></div>

            <div class="toolbar-item">
                <button class="toolbar-button" id="editor-button-copy">
                    <i class="fa fa-files-o"></i>
                    <span>Copy</span>
                </button>
            </div>

            <div class="toolbar-item">
                <button class="toolbar-button" id="editor-button-cut">
                    <i class="fa fa-scissors"></i>
                    <span>Cut</span>
                </button>
            </div>

            <div class="toolbar-item">
                <button class="toolbar-button" id="editor-button-paste">
                    <i class="fa fa-clipboard"></i>
                    <span>Paste</span>
                </button>
            </div>

            <div class="toolbar-item">
                <button class="toolbar-button" id="editor-button-delete">
                    <i class="fa fa-trash"></i>
                    <span>Delete</span>
                </button>
            </div>

            <div class="toolbar-divider"></div>

            <div class="toolbar-item">
                <button class="toolbar-button" id="editor-button-settings">
                    <i class="fa fa-gear"></i>
                    <span>Settings</span>
                </button>
            </div>

        </div>

    </div>


    <!-- Editor mode content -->
    <div class="edit-mode-content">

        <div class="editor-content" id="editor-content">
            <h2 id="editor-title">Select a Component</h2>
            
            <div class="editor" id="editor">
                
            </div>
        </div>

        <div class="app-preview" id="app-preview">

            <div class="app-preview-content" id="app-preview-content">

            </div>

        </div>

    </div>

    

    <!--Hidden content-->
    <div id="overlay-component-select" class="hidden"></div>

    <div id="overlay" class="hidden"></div>
    <div id="modal" class="hidden"></div>

    <div id="overlay-matches" class="hidden"></div>
    <div id="modal-matches" class="hidden"></div>

    <div id="overlay-settings" class="hidden"></div>
    <div id="modal-settings" class="hidden">
        <div id="settings-header">
            <h3>Settings</h3>
        </div>

        <div id="settings-content">

            <details open>
                <summary class="editor-summary">App Settings:</summary>
                <div>
                    <div class="settings-item">
                        <label>App Name</label>
                        <input type="text" id="settings-app-name" class="settings-input"></input>
                    </div>

                    <div class="settings-item">
                        <label>App Background Color</label>
                        <input type="color" id="settings-app-name" class="settings-input"></input>
                    </div>
                </div>
            </details>

            <details open>
                <summary class="editor-summary">Match Data:</summary>
                <div>
                    <!-- Events and groups -->
                    <div class="settings-events">
                        Event Types:
                        <div class="settings-event-list">
                            <div id="settings-event-types"></div>
                        </div>
                    </div>
                    
                    <div class="settings-events">
                        Event Groups:
                        <div class="settings-event-list">
                            <div id="settings-event-groups"></div>
                        </div>
                    </div>


                </div>
            </details>

        </div>

        

        <!--
        <div>
            <label> Event Code:</label> 
            <input type="text" id="settings-event-code"></input>
        </div>

        <div style="display:inline-block">
            <label>Edit Mode:</label> 
            <input type="checkbox" id="settings-editor-enabled" style="scale:1.5"></input>
        </div>

        <div>
        <button id="settings-reset-button">
            Clear all match data
        </button>
        </div>
        -->

    </div>

    <div id="bluetooth-status" class="hidden"></div>

    <div class="hidden" id="textbox-editor">
        <div class="textbox-style-bar" id ="textbox-style-bar">
            <select class="textbox-editor-font" id="textbox-editor-font" style="margin-bottom: 0;"> </select>

            <input type="number" class="textbox-editor-font-size" id="textbox-editor-font-size" min="1" max="500" style="margin-bottom: 0;">

            <!--
            <div class="textbox-editor-divider"></div>-->

            <button class="textbox-editor-button" id="textbox-editor-bold" title="Bold">
                <i class="fa fa-bold"></i>
            </button>

            <button class="textbox-editor-button" id="textbox-editor-italic" title="Italic">
                <i class="fa fa-italic"></i>
            </button>

            <button class="textbox-editor-button" id="textbox-editor-underline" title="Underline">
                <i class="fa fa-underline"></i>
            </button>

            <div class="textbox-editor-divider"></div>

            <label class="textbox-editor-color">
                <i class="fa fa-paint-brush" id="textbox-editor-text-color-icon"></i>

                <input type="color" id="textbox-editor-text-color" value="#000000">
            </label>

            <div class="textbox-editor-divider"></div>

            <button class="textbox-editor-button" id="textbox-editor-align-left" title="Align Left">
                <i class="fa fa-align-left"></i>
            </button>

            <button class="textbox-editor-button" id="textbox-editor-align-center" title="Align Center">
                <i class="fa fa-align-center"></i>
            </button>

            <button class="textbox-editor-button" id="textbox-editor-align-right" title="Align Right">
                <i class="fa fa-align-right"></i>
            </button>

        </div>

        <div class="textbox-editor-textbox" id="textbox-editor-textbox" contenteditable="true">
        </div>

    </div>

</div>

</body>
