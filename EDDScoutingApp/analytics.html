<!DOCTYPE html>
<html>
<head>
    <title>FRC Scouting Analytics</title>
    <link rel="stylesheet" href="styles.css">
    <script type="importmap">
    {
        "imports": {
            "chart.js/auto": "/node_modules/chart.js/auto/auto.js",
            "@kurkle/color": "/node_modules/@kurkle/color/dist/color.esm.js"
        }
    }
    </script>

    <style id="style">
        th, td {
            border: 1px solid;
            padding: 5px;
            min-width: 100px;
        }
        table {
            border-collapse: collapse;
        }
        img {
            width: 400px;
            height: 400px;
        }
    </style>
</head>
<body>

<div id="preview">
    <div style="display:flex">

        <div style="display:inline-block">
            <h1>Analytics</h1>
            <label>Upload Match Data:</label>
            <input id="load" type="file" accept="application/json" multiple></input>
            <div>
                <button id="bluetooth">Send Data (Bluetooth)</button>
            </div>
            <label>Team Number(s):</label>
            <div>
                <input id="team1" type="number" style="width:20%;font-size:large;"></input>
                <input id="team2" type="number" style="width:20%;font-size:large;"></input>
                <input id="team3" type="number" style="width:20%;font-size:large;"></input>
            </div>

            <label>Events: (optional - select to generate graphs)</label>
            <div style="height:30%;">
                <select multiple id="events" style="width:50%;height:100%;"></select>
            </div>
            <button id="test">Generate Analytics</button>
        </div>

        <div style="display: inline-block;">
            <h3>Schedule Status:</h3>
            <div style="overflow-y: auto;height:300px">
                <table id="schedule-table">
                    <tr>
                        <th>Match #</th>
                        <th>Red 1</th>
                        <th>Red 2</th>
                        <th>Red 3</th>
                        <th>Blue 1</th>
                        <th>Blue 2</th>
                        <th>Blue 3</th>
                    </tr>
                </table>
            </div>
        </div>
    
    </div>

    <hr>

    <button id="export">Export Analytics</button>

    <div style="margin-top:25px;">

        <div style="overflow-x: auto;" id="table1511-div-1">
            <table id="table1511-1">
                
            </table>
        </div>

        <div style="overflow-x: auto;" id="table1511-div-2">
            <table id="table1511-2" class="hidden">
                
            </table>
        </div>

        <div style="overflow-x: auto;" id="table1511-div-3">
            <table id="table1511-3" class="hidden">
            
            </table>
        </div>


       <!-- <button id="table-export">Export to CSV</button> -->
    </div>

    <div style="margin-top:70px;">
        <canvas id="graph1" width="400px" height="400px"></canvas>
        <canvas id="graph2" width="400px" height="400px" class="hidden"></canvas>
        <canvas id="graph3" width="400px" height="400px" class="hidden"></canvas>
    </div>

    <div>
        <canvas id="piechart" width="300px" height="300px"></canvas>
    </div>
    
    <div style="margin-top:25px;">
        <table id="table">

        </table>
    </div>

</div>

<!--
<script type="module" src="./dist/analytics.js"></script>
-->
<script type="module" src="/src/analytics.ts"></script>

</body>
</html>
