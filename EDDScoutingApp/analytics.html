<!DOCTYPE html>
<html>
<head>
    <title>FRC Scouting Analytics</title>
    <link rel="stylesheet" href="styles.css">
    <script type="importmap">
    {
        "imports": {
            "chart.js/auto": "/node_modules/chart.js/auto/auto.js",
            "@kurkle/color": "/node_modules/@kurkle/color/dist/color.esm.js"
        }
    }
    </script>

    <style>
        th, td {
            border: 1px solid;
            padding: 5px;
        }
        table {
            border-collapse: collapse;
            border: 1px solid;
        }
    </style>
</head>
<body>

<div id="preview">
    <h1>Analytics</h1>
    <label>Upload Match Data:</label>
    <input id="load" type="file" accept="application/json" multiple></input>
    <div>
        <button id="bluetooth">Send Data (Bluetooth)</button>
    </div>
    <label>Team Number(s):</label>
    <div>
        <input id="team1" type="number" style="width:10%;font-size:large;"></input>
        <input id="team2" type="number" style="width:10%;font-size:large;"></input>
        <input id="team3" type="number" style="width:10%;font-size:large;"></input>
    </div>

    <label>Events:</label>
    <div style="height:20%;">
        <select multiple id="events" style="width:30%;height:100%;"></select>
    </div>
    <button id="test">Generate Analytics</button>

    <hr>

    <div style="margin-top:50px;">
        <table id="table1511-1">
            
        </table>

        <table id="table1511-2" class="hidden" style="margin-top:25px">
            
        </table>

        <table id="table1511-3" class="hidden" style="margin-top:25px">
            
        </table>
        <button id="table-export">Export to CSV</button>
    </div>

    <div>
        <canvas id="graph1" width="500px" height="500px"></canvas>
        <canvas id="graph2" width="500px" height="500px" class="hidden"></canvas>
        <canvas id="graph3" width="500px" height="500px" class="hidden"></canvas>
    </div>

    <div>
        <canvas id="piechart" width="600px" height="600px"></canvas>
    </div>
    
    <div style="margin-top:25px;">
        <table id="table">

        </table>
    </div>

</div>

<!--
<script type="module" src="./dist/analytics.js"></script>
-->
<script type="module" src="/src/analytics.ts"></script>

</body>
</html>
